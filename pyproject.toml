[project]
name = "bot-rcte"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "discord-py>=2.7.1",
    "python-dotenv>=1.2.4",
    "aiohttp>=3.12.0",
    "tzdata>=2026.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP"]
